server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: medivault-security-backend
  datasource:
    url: jdbc:h2:mem:medivaultdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

medivault:
  security:
    jwt:
      # En produccion debe venir de una variable de entorno (JWT_SECRET), nunca del repositorio
      secret: ${JWT_SECRET:MediVaultSecretKey-UCR-IF0009-LabSeguridad-2026-CambiarEnProduccion}
      expiration-ms: 3600000